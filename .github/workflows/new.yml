name: Build smartdns ipk
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: mkdir dir
        run: |
          mkdir -p ./output

      - name: Build smartdns + luci-app-smartdns
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: qualcommax-ipq60xx
          EXTRA_FEEDS: "smartdns;https://github.com/pymumu/smartdns.git|luci_app_smartdns;https://github.com/pymumu/luci-app-smartdns.git"
          PACKAGES: "smartdns luci-app-smartdns"
          V: s
          INDEX: 1
          ARTIFACTS_DIR: ${{ github.workspace }}/output

      - name: Upload ipk
        uses: actions/upload-artifact@v4
        with:
          name: smartdns-ipk
          path: ${{ env.SDK_DIR }}/output/
