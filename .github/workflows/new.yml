name: Build smartdns ipk
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build smartdns + luci-app-smartdns
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: qualcommax-ipq60xx-25.12
          EXTRA_FEEDS: "src-git smartdns https://github.com/pymumu/smartdns.git|src-git luci_app_smartdns https://github.com/pymumu/luci-app-smartdns.git"
          PACKAGES: "smartdns luci-app-smartdns"
          V: s
          INDEX: 1
          ARTIFACTS_DIR: ${{ github.workspace }}/output

      - name: Collect apk
        id: collect
        working-directory: ${{ env.SDK_DIR }}
        run: |
          mkdir -p ./output
          find bin/packages -name "*.apk" -o -name "*.ipk" -o -name "*.zst" | xargs cp -t ./output

      - name: Upload ipk
        uses: actions/upload-artifact@v4
        with:
          name: smartdns-ipk
          path: ${{ env.SDK_DIR }}/output/
